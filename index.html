<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIB Ads - Admin Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Styles adapted from the original index.html */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap'); 

        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Vazirmatn', Arial, Helvetica, sans-serif;overflow-x:hidden;background: #0d0c1d;color: #fff;}
        
        .app-screen {
            position: fixed;
            inset: 0;
            background: #0d0c1d;
            transition: opacity .5s ease-in;
            display: none; /* Default: hidden */
            flex-direction: column;
            padding: 15px;
            overflow-y: auto;
            z-index: 10; 
        }
        .app-screen.visible {
            display: flex; /* Show when visible */
            z-index: 20; 
        }

        /* Loading Screen */
        .loading-screen{
            position:fixed;inset:0;background:#0d0c1d;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;transition:opacity .5s ease-out
        }
        .loading-screen.hidden{opacity:0;pointer-events:none}
        .spinner-circle{width:80px;height:80px;border:8px solid #0a081a;border-top:8px solid #f0b90b;border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360)}}

        /* Admin Styles */
        .admin-header{text-align:center;margin-bottom:20px}
        .admin-header h2{color:#f0b90b;font-family:'Orbitron', sans-serif;margin-bottom:10px}
        
        .admin-section{
            background: #1a1835;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 5px solid #f0b90b;
        }

        .admin-section h3{
            color:#fff;
            margin-top:0;
            margin-bottom:15px;
            padding-bottom:10px;
            border-bottom: 1px solid #2f2c4a;
        }

        /* Withdrawal List */
        #pendingWithdrawalsList{margin-top:10px}
        .admin-list-item{
            background:#2f2c4a;
            padding:10px;
            border-radius:6px;
            margin-bottom:10px;
            display:flex;
            justify-content:space-between;
            align-items:center
        }
        .admin-list-item h4{margin:0;color:#f0b90b}
        .admin-list-item p{margin:2px 0;font-size:.9em}
        .admin-actions button{
            padding:6px 10px;
            margin-left:5px;
            border:none;
            border-radius:4px;
            cursor:pointer;
            font-weight:700;
        }
        .accept-btn{background:#4CAF50;color:#fff}
        .reject-btn{background:#f44336;color:#fff}
        .ban-btn{background:#6c757d;color:#fff}
        .no-records{text-align:center;color:#ccc;padding:20px}

        /* Form Controls */
        .admin-form label{display:block;margin-bottom:5px;font-size:.9em}
        .admin-form input, .admin-form button{
            width:100%;
            padding:10px;
            margin-bottom:10px;
            border-radius:5px;
            border:1px solid #4a466b;
            background:#3a3754;
            color:#fff;
            font-size:1em
        }
        .admin-form button{
            background:#f0b90b;
            color:#0d0c1d;
            font-weight:700;
            cursor:pointer;
            transition:background .3s
        }
        .admin-form button:hover{background:#e0a800}

        /* Custom Alert Styling (Keep from original) */
        .custom-alert{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:20px;background:#1a1835;border-radius:10px;box-shadow:0 0 15px rgba(0,0,0,.5);z-index:10000;display:none;max-width:300px;width:90%;text-align:center;border:2px solid #f0b90b;opacity:0;transition:opacity .3s ease-in-out}.custom-alert.visible{display:block;opacity:1}.custom-alert-title{font-size:1.2em;font-weight:700;margin-bottom:10px;color:#f0b90b}.custom-alert-message{margin-bottom:15px;color:#ccc}.custom-alert-btn{padding:8px 15px;background:#f0b90b;color:#0d0c1d;border:none;border-radius:5px;cursor:pointer;font-weight:700}.custom-alert.error{border-color:#f44336}.custom-alert.error .custom-alert-title{color:#f44336}.custom-alert.success{border-color:#4CAF50}.custom-alert.success .custom-alert-title{color:#4CAF50}
    </style>
</head>
<body>
    <div class="loading-screen visible" id="loading-screen">
        <div class="spinner-circle"></div>
        <p style="color:#fff; margin-top: 15px;">Loading Admin Panel...</p>
    </div>

    <div class="app-screen" id="admin-screen">
        <div class="admin-header">
            <h2>لوحة تحكم المسؤول</h2>
            <p style="color: #ccc;">مرحباً بك، أيها المسؤول. (Telegram ID: <span id="admin-id">...</span>)</p>
        </div>
        
        <div class="admin-section">
            <h3 onclick="loadAdminData()">طلبات السحب المعلقة (اضغط للتحديث)</h3>
            <div id="pendingWithdrawalsList">
                <div class="no-records">Loading requests...</div>
            </div>
        </div>

        <div class="admin-section">
            <h3>تعديل رصيد المستخدم</h3>
            <form id="modifyBalanceForm" class="admin-form">
                <label for="targetUserId">معرّف المستخدم (ID):</label>
                <input type="number" id="targetUserId" required placeholder="ادخل Telegram ID">

                <label for="amountToAdd">المبلغ (SHIB) - للمنح إيجابي، للسحب سلبي:</label>
                <input type="number" id="amountToAdd" required placeholder="مثال: 100 أو -50">

                <button type="submit">تعديل الرصيد</button>
            </form>
        </div>

        <div class="admin-section">
            <h3>إعادة تعيين مهمة الانضمام</h3>
            <form id="resetTaskForm" class="admin-form">
                <label for="resetTargetUserId">معرّف المستخدم (ID):</label>
                <input type="number" id="resetTargetUserId" required placeholder="ادخل Telegram ID">

                <button type="submit">إعادة تعيين المهمة</button>
            </form>
        </div>

        <div class="admin-section" style="text-align: center;">
             <button onclick="Telegram.WebApp.close()" style="background:#f44336; color:#fff; border-radius:5px; padding: 10px 20px; border: none; font-weight: bold; width: auto;">إغلاق التطبيق</button>
        </div>
    </div>

    <div id="customAlert" class="custom-alert">
        <div class="custom-alert-title" id="alertTitle"></div>
        <div class="custom-alert-message" id="alertMessage"></div>
        <button class="custom-alert-btn" onclick="document.getElementById('customAlert').classList.remove('visible')">موافق</button>
    </div>

    <script>
        // Global State & Constants
        let user_id = null;
        const state = { is_admin: false };

        // --- Utility Functions (Keep essential ones) ---

        function showCustomAlert(title, message, type = 'info') {
            const alert = document.getElementById('customAlert');
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = message;
            alert.className = `custom-alert visible ${type}`;
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.app-screen').forEach(screen => {
                screen.classList.remove('visible');
                // Ensure only one screen is visible for Admin.html
                if (screen.id === screenId) {
                    screen.classList.add('visible');
                }
            });
        }

        // --- API Helpers ---
        
        async function fetchApi(payload) {
            const finalPayload = { 
                ...payload, 
                user_id: user_id.toString(), // Always send user_id as string
                initData: Telegram.WebApp.initData 
            };
            
            try {
                const response = await fetch('/api', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(finalPayload)
                });

                const result = await response.json();
                
                if (!result.ok) {
                    showCustomAlert('Error!', result.error || 'An unknown error occurred on the server.', 'error');
                }
                return result;
            } catch (error) {
                console.error('API Call Failed:', error);
                showCustomAlert('Connection Error', 'Could not connect to the server. Please try again later.', 'error');
                return { ok: false, error: 'Connection Failed' };
            }
        }

        async function requestActionId(actionType) {
            const result = await fetchApi({ type: 'generateActionId', action_type: actionType });
            if (result.ok) {
                return result.data.action_id;
            }
            return null;
        }

        // --- Admin Logic ---

        // 1. Load Data
        async function loadAdminData() {
            // 1. Fetch Admin ID
            document.getElementById('admin-id').innerText = user_id;

            // 2. Fetch Pending Withdrawals
            const result = await fetchApi({ type: 'getPendingWithdrawals' });
            if (result.ok) {
                const pending_withdrawals = result.data.pending_withdrawals;
                displayPendingWithdrawals(pending_withdrawals);
            } else {
                displayPendingWithdrawals([]);
            }
        }

        // 2. Display Withdrawals (Corrected: uses e.id)
        function displayPendingWithdrawals(e){
            const t=document.getElementById('pendingWithdrawalsList');
            if(!e||0===e.length)return void(t.innerHTML='<div class="no-records">No pending withdrawal requests.</div>');
            let s='';
            e.forEach(e=>{
                // 🚨 التصحيح: استخدام e.id بدلاً من e.request_id
                s+=`<div class="admin-list-item" data-request-id="${e.id}">
                    <div class="user-info-admin">
                        <h4>User ID: ${e.user_id}</h4>
                        <p>Amount: ${e.amount.toLocaleString()} SHIB | Binance ID: ${e.binance_id} | Date: ${new Date(e.created_at).toLocaleDateString('en-GB')}</p>
                    </div>
                    <div class="admin-actions">
                        <button class="action-btn accept-btn" onclick="handleAdminAction('${e.id}','accept')">Accept</button>
                        <button class="action-btn reject-btn" onclick="handleAdminAction('${e.id}','reject')">Reject</button>
                        <button class="action-btn ban-btn" onclick="handleAdminAction('${e.id}','ban','${e.user_id}')">Ban</button>
                    </div>
                </div>`
            }),t.innerHTML=s
        }

        // 3. Admin Action (Accept/Reject/Ban)
        async function handleAdminAction(request_id, action, user_to_ban = null){
            const actionId = await requestActionId('adminAction');
            if (!actionId) return;
            
            const result = await fetchApi({
                type: 'adminAction',
                // request_id: مطلوب فقط لـ 'accept' و 'reject'
                request_id: action !== 'ban' ? request_id : null, 
                action: action,
                // user_to_ban: مطلوب فقط لـ 'ban'
                user_to_ban: action === 'ban' ? user_to_ban : null, 
                action_id: actionId
            });

            if (result.ok) {
                showCustomAlert('Success', result.data.message, 'success');
                // Reload data after a successful action
                await loadAdminData(); 
            }
        }

        // 4. NEW: Modify Balance Logic
        document.getElementById('modifyBalanceForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const targetId = document.getElementById('targetUserId').value;
            const amount = document.getElementById('amountToAdd').value;
            
            const actionId = await requestActionId('modifyBalance');
            if (!actionId) return;

            const result = await fetchApi({
                type: 'modifyBalance',
                target_user_id: targetId,
                amount_to_add: amount,
                action_id: actionId
            });

            if (result.ok) {
                showCustomAlert('Balance Adjusted', result.data.message + ` New Balance: ${result.data.new_balance.toLocaleString()}`, 'success');
                document.getElementById('modifyBalanceForm').reset();
            }
        });

        // 5. NEW: Reset Task Logic
        document.getElementById('resetTaskForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const targetId = document.getElementById('resetTargetUserId').value;
            
            const actionId = await requestActionId('resetTask');
            if (!actionId) return;

            const result = await fetchApi({
                type: 'resetTask',
                target_user_id: targetId,
                action_id: actionId
            });

            if (result.ok) {
                showCustomAlert('Task Reset', result.data.message, 'success');
                document.getElementById('resetTaskForm').reset();
            }
        });


        // --- Initialization ---

        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        // ⚠️ يجب التحقق من هوية المسؤول هنا
        try {
            const initData = Telegram.WebApp.initDataUnsafe;
            if (initData.user && initData.user.id) {
                user_id = initData.user.id;
                
                // 1. تحقق من هوية المسؤول (من خلال طلب بسيط للحصول على البيانات)
                const checkAdmin = await fetchApi({ type: 'getUserData' });
                
                if (checkAdmin.ok && checkAdmin.data.is_admin) {
                    switchScreen('admin-screen');
                    document.getElementById('loading-screen').classList.add('hidden');
                    loadAdminData();
                } else {
                    // إذا لم يكن مسؤولاً، يتم الرفض
                    showCustomAlert('Access Denied', 'You are not authorized to view the admin panel.', 'error');
                    document.getElementById('loading-screen').classList.add('hidden');
                }
            } else {
                showCustomAlert('Error', 'Telegram User ID not found.', 'error');
            }
        } catch (error) {
            console.error('Initialization Error:', error);
            showCustomAlert('Critical Error', 'Failed to initialize app data.', 'error');
        }
    </script>
</body>
</html>
